<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeVerse — Deliver work. Track views. Get reviews.</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#16302A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FreeVerse">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --cream:#F6F2E9;
  --cream-2:#EFE9DA;
  --paper:#FFFFFF;
  --ink:#16302A;      /* deep forest green - primary text/elements */
  --ink-2:#3C5449;     /* softer green for secondary text */
  --muted:#8A8371;     /* warm taupe for tertiary text */
  --line:#E1D9C4;      /* hairline borders */
  --gold:#E7A94C;      /* rating/accent gold */
  --gold-dim:#E4DCC8;  /* faded star */
  --danger:#B4543A;
  --radius:14px;
  --radius-sm:8px;
  --shadow: 0 1px 2px rgba(22,48,42,0.06), 0 8px 24px rgba(22,48,42,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

#app{max-width:1200px;margin:0 auto;min-height:100vh;}
.center-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

/* ---------- Top nav (marketing) ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;padding:28px 32px;}
.logo{font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:-0.01em;color:var(--ink);}
.nav-links{display:flex;gap:32px;align-items:center;font-size:14px;color:var(--ink-2);}
.nav-links a:hover{color:var(--ink);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:999px;border:1px solid transparent;
  font-size:14px;font-weight:600;transition:transform .15s ease, opacity .15s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--ink);color:var(--cream);}
.btn-primary:hover{opacity:0.88;}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-sm{padding:8px 16px;font-size:13px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:0.45;cursor:not-allowed;}

/* ---------- Hero ---------- */
.hero{padding:24px 32px 80px;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;}
@media (max-width:880px){.hero{grid-template-columns:1fr;}}
.hero h1{font-size:52px;line-height:1.05;font-weight:500;margin:0 0 20px;letter-spacing:-0.01em;}
.hero p.sub{color:var(--ink-2);font-size:17px;line-height:1.6;max-width:440px;margin:0 0 28px;}
.hero-actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.hint{font-size:13px;color:var(--muted);}

/* radial illustration - signature element, customizable via CLIENT_AVATARS array in JS */
.radial{position:relative;width:100%;max-width:440px;aspect-ratio:1/1;margin:0 auto;}
.radial svg{position:absolute;inset:0;width:100%;height:100%;}
.node{position:absolute;border-radius:50%;overflow:hidden;background:var(--cream-2);border:3px solid var(--paper);box-shadow:var(--shadow);}
.node img{width:100%;height:100%;object-fit:cover;display:block;}
.node.center{width:34%;height:34%;left:33%;top:33%;z-index:3;border-width:4px;}
.node.orbit{width:19%;height:19%;z-index:2;}
.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);}

/* ---------- Auth / onboarding pages ---------- */
.auth-shell{width:100%;max-width:420px;}
.auth-shell .card{padding:36px 32px;}
.step-label{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px;}
.auth-shell h2{font-size:26px;margin:0 0 6px;font-weight:500;}
.auth-shell .lede{color:var(--ink-2);font-size:14px;margin:0 0 26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.field .opt{font-weight:400;color:var(--muted);}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);
  font-size:14px;color:var(--ink);background:var(--cream);
}
.field input:focus,.field select:focus,.field textarea:focus{background:var(--paper);}
.field textarea{resize:vertical;min-height:96px;}
.progress-dots{display:flex;gap:6px;margin-bottom:22px;}
.progress-dots span{height:4px;flex:1;border-radius:2px;background:var(--line);}
.progress-dots span.done{background:var(--ink);}

.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;}
.google-btn:hover{border-color:var(--ink);}

/* ---------- App shell (dashboard etc) ---------- */
.app-shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
@media (max-width:800px){.app-shell{grid-template-columns:1fr;}.sidebar{display:none;}}
.sidebar{border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;}
.sidebar .logo{padding:6px 8px 26px;}
.side-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;color:var(--ink-2);margin-bottom:2px;}
.side-link:hover{background:var(--cream-2);}
.side-link.active{background:var(--ink);color:var(--cream);}
.side-link .badge{margin-left:auto;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;}
.main{padding:28px 36px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
.topbar-right{display:flex;align-items:center;gap:16px;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;position:relative;}
.dot-badge{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:1.5px solid var(--paper);}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
@media (max-width:700px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat{padding:18px 20px;}
.stat .n{font-size:26px;font-weight:600;font-family:'Fraunces',serif;}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px;}
.stat .delta{font-size:12px;color:#3F7A5A;margin-top:6px;}

.section-title{display:flex;align-items:center;justify-content:between;justify-content:space-between;margin:8px 0 14px;}
.section-title h3{font-size:16px;margin:0;font-weight:600;}
.section-title a{font-size:13px;color:var(--ink-2);}

.list-row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}
.thumb{width:44px;height:44px;border-radius:10px;background:var(--cream-2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.thumb img{width:100%;height:100%;object-fit:cover;}
.row-title{font-weight:600;font-size:14px;}
.row-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.stars{color:var(--gold);font-size:13px;white-space:nowrap;}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--cream-2);color:var(--ink-2);font-weight:600;}

.empty{padding:60px 20px;text-align:center;color:var(--muted);}
.empty h3{color:var(--ink);margin-bottom:6px;}

/* upload dropzone */
.dropzone{border:2px dashed var(--line);border-radius:var(--radius);padding:44px 20px;text-align:center;background:var(--paper);cursor:pointer;transition:border-color .15s;}
.dropzone.drag{border-color:var(--ink);background:var(--cream-2);}
.dropzone .cloud{font-size:34px;margin-bottom:10px;}
.file-chip{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:8px;}
.file-chip .name{flex:1;font-size:13px;font-weight:600;}
.file-chip .size{font-size:12px;color:var(--muted);}
.file-chip button{background:none;border:none;color:var(--muted);font-size:16px;line-height:1;}
.size-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:14px 0 6px;}
.size-bar-fill{height:100%;background:var(--ink);border-radius:3px;transition:width .2s;}
.size-bar-fill.over{background:var(--danger);}

/* stars input */
.star-input{display:flex;gap:8px;font-size:34px;color:var(--gold-dim);margin:10px 0 22px;}
.star-input span{cursor:pointer;transition:transform .1s, color .1s;}
.star-input span.lit{color:var(--gold);text-shadow:0 0 12px rgba(231,169,76,0.55);}
.star-input span:hover{transform:scale(1.12);}

/* success / thank you circles */
.check-circle{width:88px;height:88px;border-radius:50%;background:var(--cream-2);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:36px;color:#3F7A5A;}

.link-box{display:flex;align-items:center;gap:10px;background:var(--cream-2);border-radius:var(--radius-sm);padding:12px 14px;margin:16px 0;}
.link-box span{flex:1;font-size:14px;font-weight:600;}

.modal-bg{position:fixed;inset:0;background:rgba(22,48,42,0.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal{max-width:380px;width:100%;padding:28px;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:60;}

.upgrade-card{background:var(--ink);color:var(--cream);border-radius:var(--radius);padding:28px;}
.upgrade-card h2{color:var(--cream);}
.upgrade-card ul{list-style:none;padding:0;margin:18px 0;}
.upgrade-card li{padding:6px 0;font-size:14px;display:flex;gap:8px;}
.price{font-family:'Fraunces',serif;font-size:34px;margin:10px 0 2px;}
.price small{font-size:13px;font-weight:400;opacity:.75;}

.chart-wrap{padding:20px;}
.gallery{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--ink);aspect-ratio:16/10;}
.gallery img{width:100%;height:100%;object-fit:cover;}
.gallery-nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.9);border:none;display:flex;align-items:center;justify-content:center;font-size:16px;}
.gallery-nav.prev{left:12px;}
.gallery-nav.next{right:12px;}
.gallery-count{position:absolute;bottom:10px;right:12px;background:rgba(22,48,42,0.65);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px;}

.pdf-sheet{background:#fff;color:#111;padding:40px;border-radius:8px;max-width:480px;margin:0 auto;font-family:'Inter',sans-serif;box-shadow:var(--shadow);}
.pdf-sheet .plogo{font-family:'Fraunces',serif;color:var(--ink);font-weight:600;font-size:18px;}
.pdf-sheet h1{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin:22px 0 18px;}
.pdf-row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid #eee;}
.pdf-row b{font-weight:600;}

.tiny-nav{display:flex;gap:6px;margin-bottom:22px;}
.tiny-nav button{background:none;border:none;color:var(--ink-2);font-size:13px;}
.tiny-nav button:hover{color:var(--ink);text-decoration:underline;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>

<script>
/* ============================================================
   FreeVerse — wired to a real Firebase backend.
   - Firestore `projects/{id}` doc ID = the public share link id.
   - Auth: Google sign-in via Firebase Auth.
   - Storage: file uploads at /projects/{id}/{fileName}.
   - Cloud Functions (see /freeverse-backend): finalizeUpload enforces the
     plan's storage limit server-side; onProjectReviewed generates the PDF
     report and emails the freelancer.
   See FRONTEND_INTEGRATION.md in the backend folder for the full wiring notes.
   ============================================================ */

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB3W1yV7VUZaEAZT8V2OtwR7Zu0vhilqLg",
  authDomain: "freeverse-d21a3.firebaseapp.com",
  projectId: "freeverse-d21a3",
  storageBucket: "freeverse-d21a3.firebasestorage.app",
  messagingSenderId: "146398305283",
  appId: "1:146398305283:web:53016e4ef5463b34c08236"
};
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();

// -------- Render backend (replaces what used to be Cloud Functions) --------
// Fill this in once you've deployed /freeverse-render-backend to Render.
const BACKEND_URL = "https://freeverse-backend.onrender.com";

// -------- Customize the hero illustration here --------
// Swap these URLs for real client photos any time — the layout adapts automatically.
const CLIENT_AVATARS = [
  "https://i.pravatar.cc/200?img=47",
  "https://i.pravatar.cc/200?img=12",
  "https://i.pravatar.cc/200?img=33",
  "https://i.pravatar.cc/200?img=51"
];
const FREELANCER_AVATAR = "https://i.pravatar.cc/200?img=68";

const FREE_LIMIT_BYTES = 1024 * 1024 * 1024; // 1GB (server-side truth lives in finalizeUpload)
const PREVIEW_MAX_BYTES = 350 * 1024; // only inline-preview images under this size, pre-upload

let SESSION = null; // {uid, name, service, business, avatar, plan}
let ROUTE = {};


function uid(n){ n = n||8; const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function fmtBytes(b){ if(b>1e9) return (b/1e9).toFixed(2)+' GB'; if(b>1e6) return (b/1e6).toFixed(1)+' MB'; if(b>1e3) return (b/1e3).toFixed(0)+' KB'; return b+' B'; }
function toMillis(ts){
  if(!ts) return Date.now();
  if(typeof ts === 'number') return ts;
  if(typeof ts.toMillis === 'function') return ts.toMillis(); // Firestore Timestamp
  if(ts.seconds != null) return ts.seconds*1000; // plain {seconds,nanoseconds} shape
  return Date.now();
}
function fmtDate(ts){ const d=new Date(toMillis(ts)); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function esc(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// ---------------- Render backend calls ----------------
async function backendFetch(path, body, authed){
  const headers = { 'Content-Type': 'application/json' };
  if(authed){
    const token = await auth.currentUser.getIdToken();
    headers['Authorization'] = 'Bearer ' + token;
  }
  const res = await fetch(BACKEND_URL + path, { method:'POST', headers, body: JSON.stringify(body||{}) });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('Request failed ('+res.status+')'));
  return data;
}
async function uploadFileToCloudinary(file, sig){
  const form = new FormData();
  form.append('file', file);
  form.append('api_key', sig.apiKey);
  form.append('timestamp', sig.timestamp);
  form.append('signature', sig.signature);
  form.append('folder', sig.folder);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${sig.cloudName}/auto/upload`, { method:'POST', body: form });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error?.message || 'Upload failed');
  return data; // { secure_url, public_id, bytes, ... }
}
function showToast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  root.appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}
function nav(hash){ window.location.hash = hash; }

// ---------------- session + data helpers (Firebase-backed) ----------------
async function loadSession(){
  const user = auth.currentUser;
  if(!user){ SESSION = null; return; }
  const snap = await db.collection('users').doc(user.uid).get();
  const data = snap.exists ? snap.data() : {};
  SESSION = {
    uid: user.uid,
    name: data.name || user.displayName || '',
    service: data.service || '',
    business: data.business || '',
    avatar: user.photoURL || null,
    plan: data.plan || 'free'
  };
}
async function saveSession(patch){
  Object.assign(SESSION, patch);
  await db.collection('users').doc(SESSION.uid).set(patch, { merge: true });
}

async function getMyProjectIds(){
  if(!SESSION) return [];
  const snap = await db.collection('projects')
    .where('ownerId','==',SESSION.uid)
    .orderBy('createdAt','desc')
    .get();
  return snap.docs.map(d => d.id);
}
async function getProject(id){
  const doc = await db.collection('projects').doc(id).get();
  return doc.exists ? Object.assign({ id: doc.id }, doc.data()) : null;
}
async function saveProject(p){
  // owner writes (create/edit) and anonymous client writes (viewed/review)
  // both land here — firestore.rules is what actually restricts which
  // fields each caller may touch, not this function.
  await db.collection('projects').doc(p.id).set(p, { merge: true });
}
async function getAckMap(){
  if(!SESSION) return {};
  const snap = await db.collection('users').doc(SESSION.uid).get();
  return (snap.exists && snap.data().ackMap) || {};
}
async function setAck(id, patch){
  const m = await getAckMap();
  m[id] = Object.assign({}, m[id]||{}, patch);
  await db.collection('users').doc(SESSION.uid).set({ ackMap: m }, { merge: true });
}

// ---------------- router ----------------
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => {
  // public /p/:id client links don't need a session at all — paint right away
  // rather than waiting on Firebase Auth to resolve first.
  if(parseHash()[0] === 'p') render();
});
auth.onAuthStateChanged(async (user) => {
  if(user){
    await db.collection('users').doc(user.uid).set({
      name: user.displayName || '',
      email: user.email || null
    }, { merge: true });
  }
  await loadSession();
  const parts = parseHash();
  if(user && (parts[0]==='signin' || parts[0]===undefined || parts[0]==='')){
    nav(SESSION.service ? '#/dashboard' : '#/onboarding');
    return;
  }
  render();
});

function parseHash(){
  const h = (window.location.hash || '#/').replace(/^#/, '');
  const parts = h.split('/').filter(Boolean);
  return parts;
}

async function render(){
  const parts = parseHash();
  const app = document.getElementById('app');
  let html = '';

  // public client routes work with no session required
  if(parts[0] === 'p' && parts[1]){
    const project = await getProject(parts[1]);
    if(!project){ html = notFoundView(); }
    else if(parts[2] === 'review'){ html = await clientReviewView(project); }
    else if(parts[2] === 'thanks'){ html = clientThanksView(project); }
    else { html = await clientProjectView(project); }
    app.innerHTML = html; bindEvents(); return;
  }

  // gate app screens behind onboarding/session
  const needsSession = ['onboarding','welcome-email','dashboard','projects','create-project','project-details','project-created','analytics','notifications','settings','upgrade','review'];
  if(!SESSION && (needsSession.includes(parts[0]))){
    nav('#/'); return;
  }

  switch(parts[0]){
    case undefined:
    case '': html = heroView(); break;
    case 'onboarding': html = onboardingView(); break;
    case 'signin': html = signinView(); break;
    case 'welcome-email': html = welcomeEmailView(); break;
    case 'dashboard': html = await dashboardView(); break;
    case 'projects': html = await projectsListView(); break;
    case 'create-project': html = createProjectView(); break;
    case 'project-details': html = projectDetailsView(); break;
    case 'project-created': html = await projectCreatedView(parts[1]); break;
    case 'analytics': html = await analyticsView(); break;
    case 'notifications': html = await notificationsView(); break;
    case 'settings': html = settingsView(); break;
    case 'upgrade': html = upgradeView(); break;
    case 'review': html = await reviewDetailView(parts[1]); break;
    default: html = notFoundView();
  }
  app.innerHTML = html;
  bindEvents();
}

function notFoundView(){
  return `<div class="center-page"><div class="card" style="padding:40px;text-align:center;max-width:380px;">
    <h2 class="serif">Nothing here</h2>
    <p style="color:var(--ink-2);font-size:14px;">This link doesn't lead anywhere — it may have expired or been mistyped.</p>
    <a href="#/" class="btn btn-primary" style="margin-top:14px;">Go to FreeVerse</a>
  </div></div>`;
}

// ---------------- 1. Hero / landing ----------------

      ${CLIENT_AVATARS.map((src,i)=>{
        const angle = (i/CLIENT_AVATARS.length) * 2*Math.PI - Math.PI/2;
        const r = 40; // percent radius
        const x = 50 + r*Math.cos(angle) - 9.5;
        const y = 50 + r*Math.sin(angle) - 9.5;
        return `<div class="node orbit" style="left:${x}%;top:${y}%;"><img src="${src}" alt=""></div>`;
      }).join('')}
    </div>
  </div>`;
}
function radialSvg(){
  // connecting lines from center to each orbit node, drawn in SVG percent coords
  const lines = CLIENT_AVATARS.map((_,i)=>{
    const angle = (i/CLIENT_AVATARS.length) * 2*Math.PI - Math.PI/2;
    const x2 = 50 + 40*Math.cos(angle), y2 = 50 + 40*Math.sin(angle);
    return `<line x1="50" y1="50" x2="${x2}" y2="${y2}" stroke="#C9BFA1" stroke-width="0.6" stroke-dasharray="2 3"/>`;
  }).join('');
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">${lines}</svg>`;
}

function filterProjects(projects, query, status){
  const q = (query||'').trim().toLowerCase();
  return projects.filter(p=>{
    const matchesQ = !q || p.name.toLowerCase().includes(q) || (p.clientName||'').toLowerCase().includes(q);
    let matchesStatus = true;
    if(status==='pending') matchesStatus = !p.viewed && !p.review;
    if(status==='viewed') matchesStatus = p.viewed && !p.review;
    if(status==='reviewed') matchesStatus = !!p.review;
    return matchesQ && matchesStatus;
  });
}

  return `<div class="app-shell">

window.downloadPdf = async function(id){
  const p = await getProject(id);
  if(!p || !p.review){ showToast('No review yet'); return; }
  if(p.reportUrl){ window.open(p.reportUrl, '_blank'); return; }
  if(!window.jspdf){ showToast('PDF library unavailable'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  doc.setFont('times','normal'); doc.setFontSize(16);
  doc.text('FreeVerse', 40, 50);
  doc.setFontSize(11); doc.setTextColor(120);
  doc.text('CLIENT REVIEW REPORT', 40, 72);
  doc.setDrawColor(225,217,196); doc.line(40,84,555,84);
  doc.setTextColor(20,40,35); doc.setFontSize(11);
  let y = 112;
  const row = (label,val)=>{ doc.setFont('helvetica','normal'); doc.setTextColor(140); doc.text(label,40,y);
    doc.setTextColor(20,40,35); doc.setFont('helvetica','bold'); doc.text(String(val),200,y); y+=22; };
  row('Project', p.name);
  row('Freelancer', p.freelancerName);
  row('Client', p.clientName||'—');
  row('Rating', '★'.repeat(p.review.rating)+'☆'.repeat(5-p.review.rating)+'  '+p.review.rating.toFixed(1));
  row('Date', fmtDate(p.review.submittedAt));
  y += 12; doc.setFont('helvetica','italic'); doc.setFontSize(12); doc.setTextColor(60,84,73);
  const lines = doc.splitTextToSize('"'+p.review.text+'"', 500);
  doc.text(lines, 40, y);
  doc.save('FreeVerse-Review-'+p.name.replace(/\s+/g,'-')+'.pdf');
};
window.sharePdf = async function(id){
  const p = await getProject(id);
  if(p && p.reportUrl){
    navigator.clipboard?.writeText(p.reportUrl).then(()=>showToast('Report link copied'));
  } else {
    showToast('Report is still generating — try again in a moment');
  }
};

// ---------------- event bindings ----------------
let PROJECTS_CACHE = [];
function bindEvents(){
  const searchInput = document.getElementById('proj-search');
  const filterSelect = document.getElementById('proj-filter');
  if(searchInput && filterSelect){
    (async ()=>{
      const ids = await getMyProjectIds();
      PROJECTS_CACHE = (await Promise.all(ids.map(getProject))).filter(Boolean);
      PROJECTS_CACHE.sort((a,b)=>toMillis(b.createdAt)-toMillis(a.createdAt));
    })();
    const refresh = ()=>{
      const listCard = document.getElementById('projects-list-card');
      if(!listCard) return;
      listCard.innerHTML = renderProjectListRows(filterProjects(PROJECTS_CACHE, searchInput.value, filterSelect.value));
    };
    searchInput.addEventListener('input', refresh);
    filterSelect.addEventListener('change', refresh);
  }
  const onboardingForm = document.getElementById('onboarding-form');
  if(onboardingForm){
    onboardingForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(onboardingForm);
      await saveSession({ service: fd.get('service'), business: fd.get('business')||'' });
      // Welcome email is skipped for now (no email provider wired up yet —
      // easy to re-add later: just point this at '#/welcome-email' again
      // once an email service is in place).
      nav('#/dashboard');
    });
  }
  const authForm = document.getElementById('auth-form');
if(authForm){
  authForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(authForm);
    const email = fd.get('email').trim();
    const password = fd.get('password');
    const submitBtn = authForm.querySelector('button[type="submit"]');
    submitBtn.disabled = true; submitBtn.textContent = 'Please wait…';
    try{
      if(AUTH_MODE === 'signup'){
        const name = fd.get('name').trim();
        const { user } = await auth.createUserWithEmailAndPassword(email, password);
        await user.updateProfile({ displayName: name });
        await db.collection('users').doc(user.uid).set({ name, email }, { merge:true });
      } else {
        await auth.signInWithEmailAndPassword(email, password);
      }
      await loadSession();
      nav(SESSION.service ? '#/dashboard' : '#/onboarding');
    }catch(err){
      console.error(err);
      const messages = {
        'auth/email-already-in-use': 'That email is already registered — try signing in instead.',
        'auth/invalid-email': 'That email address looks invalid.',
        'auth/weak-password': 'Password should be at least 6 characters.',
        'auth/wrong-password': 'Incorrect password.',
        'auth/user-not-found': "We couldn't find an account with that email."
      };
      showToast(messages[err.code] || err.message);
      submitBtn.disabled = false; submitBtn.textContent = AUTH_MODE==='signup' ? 'Create account' : 'Sign in';
    }
  });
}
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  const chooseBtn = document.getElementById('choose-files-btn');
  if(dropzone && fileInput){
    chooseBtn.addEventListener('click', ()=>fileInput.click());
    dropzone.addEventListener('click', (e)=>{ if(e.target===dropzone) fileInput.click(); });
    dropzone.addEventListener('dragover', e=>{ e.preventDefault(); dropzone.classList.add('drag'); });
    dropzone.addEventListener('dragleave', ()=>dropzone.classList.remove('drag'));
    dropzone.addEventListener('drop', e=>{ e.preventDefault(); dropzone.classList.remove('drag'); handleFiles(e.dataTransfer.files); });
    fileInput.addEventListener('change', ()=>handleFiles(fileInput.files));
  }
  const toDetails = document.getElementById('to-details-btn');
  if(toDetails){ toDetails.addEventListener('click', ()=> nav('#/project-details')); }
  const detailsForm = document.getElementById('details-form');
  if(detailsForm){
    detailsForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(detailsForm);
      const submitBtn = detailsForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true; submitBtn.textContent = 'Uploading…';
      try{
        // 1. create the project doc — its auto-generated ID becomes the public link
        const ref = db.collection('projects').doc();
        const id = ref.id;
        await ref.set({
          id, ownerId: SESSION.uid,
          name: fd.get('name').trim(),
          clientName: fd.get('clientName')||'', clientEmail: fd.get('clientEmail')||'',
          freelancerName: SESSION.name,
          files: [], totalBytes: 0,
          viewed:false, viewedAt:null, review:null,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // 2. get a signed Cloudinary upload slot (keeps the API secret on
        //    the Render backend, never in the browser), then upload the
        //    actual files straight to Cloudinary
        const sig = await backendFetch('/api/cloudinary-signature', { projectId:id }, true);
        const uploaded = [];
        for(const f of DRAFT.files){
          const result = await uploadFileToCloudinary(f.raw, sig);
          uploaded.push({ name:f.name, size:f.size, type:f.type, url:result.secure_url, publicId:result.public_id, preview: f.preview||null });
        }

        // 3. the Render backend is the source of truth on the plan's storage
        //    limit and is what actually commits the file list onto the project
        await backendFetch('/api/finalize-upload', { projectId:id, files:uploaded }, true);

        nav('#/project-created/'+id);
      }catch(err){
        console.error(err);
        if(/limit|exhausted|Pro/i.test(err.message||'')){
          showToast(err.message);
          nav('#/upgrade');
        } else {
          showToast('Something went wrong creating the project');
          submitBtn.disabled = false; submitBtn.textContent = 'Generate Link';
        }
      }
    });
  }
  const starInput = document.getElementById('star-input');
  if(starInput){
    let rating = 0;
    const spans = starInput.querySelectorAll('span');
    spans.forEach(s=>{
      s.addEventListener('click', ()=>{
        rating = parseInt(s.dataset.v);
        spans.forEach(sp=> sp.classList.toggle('lit', parseInt(sp.dataset.v) <= rating));
      });
    });
    const submitBtn = document.getElementById('submit-review-btn');
    submitBtn.addEventListener('click', async ()=>{
      if(rating===0){ showToast('Please select a star rating'); return; }
      const id = submitBtn.dataset.id;
      submitBtn.disabled = true; submitBtn.textContent = 'Submitting…';
      const review = {
        rating,
        text: document.getElementById('review-text').value.trim() || '(no written comment)',
        submittedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      await db.collection('projects').doc(id).update({ review });
      // fire-and-forget: builds the PDF and writes reportUrl back onto the
      // project doc. Not awaited so the client isn't stuck waiting on it —
      // the freelancer's review-detail screen already has a jsPDF fallback
      // for the moment before this finishes.
      backendFetch('/api/generate-report', { projectId:id }, false).catch(err=>console.error('report generation failed', err));
      nav('#/p/'+id+'/thanks');
    });
  }
}

async function handleFiles(fileList){
  let total = DRAFT.files.reduce((s,f)=>s+f.size,0);
  for(const file of fileList){
    if(total + file.size > FREE_LIMIT_BYTES * 1.2){
      showToast('That would exceed the 1GB free limit');
      break;
    }
    let preview = null;
    if(file.type.startsWith('image/') && file.size < PREVIEW_MAX_BYTES){
      preview = await new Promise(res=>{
        const r = new FileReader();
        r.onload = ()=>res(r.result);
        r.onerror = ()=>res(null);
        r.readAsDataURL(file);
      });
    }
    DRAFT.files.push({name:file.name, size:file.size, type:file.type, preview, raw:file});
    total += file.size;
  }
  renderFileList();
}

// wire the /pdf/:id route into the switch above without editing render() twice
const originalRender = render;
render = async function(){
  const parts = parseHash();
  if(parts[0]==='pdf' && parts[1]){
    if(!SESSION){ nav('#/'); return; }
    document.getElementById('app').innerHTML = await pdfView(parts[1]);
    bindEvents();
    return;
  }
  return originalRender();
};

// register the service worker — this + manifest.json is what makes the
// browser offer "Install app" / "Add to Home Screen"
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW registration failed', err));
  });
}
